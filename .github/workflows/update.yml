name: Auto Update Intel Formulas

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
    paths:
      - "packages.json"
      - "scripts/update_formulas.py"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-missing-intel-binaries:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure prebuilt-intel release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view prebuilt-intel -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create prebuilt-intel -R "${{ github.repository }}" \
              --title "Prebuilt Intel macOS Binaries" \
              --notes "Automatically compiled x86_64-apple-darwin binaries for upstream projects that do not publish macOS release assets (e.g., eza, btop)."
          fi

      - name: Build eza (x86_64-apple-darwin) if latest version missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          TAG=$(gh api repos/eza-community/eza/releases/latest --jq .tag_name)
          VERSION="${TAG#v}"
          ASSET="eza-${TAG}-x86_64-apple-darwin.tar.gz"
          if gh release view prebuilt-intel -R "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "eza $TAG already built in prebuilt-intel release."
            exit 0
          fi
          echo "Building $ASSET for x86_64-apple-darwin..."
          git clone --depth 1 --branch "$TAG" https://github.com/eza-community/eza.git /tmp/eza-src
          cd /tmp/eza-src
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p /tmp/eza-pkg/completions /tmp/eza-pkg/man
          cp target/x86_64-apple-darwin/release/eza /tmp/eza-pkg/
          curl -fsSL "https://github.com/eza-community/eza/releases/download/${TAG}/completions-${VERSION}.tar.gz" | tar -xz -C /tmp/eza-pkg/completions --strip-components=2 || true
          curl -fsSL "https://github.com/eza-community/eza/releases/download/${TAG}/man-${VERSION}.tar.gz" | tar -xz -C /tmp/eza-pkg/man --strip-components=2 || true
          tar -czf "/tmp/${ASSET}" -C /tmp/eza-pkg .
          gh release upload prebuilt-intel "/tmp/${ASSET}" --clobber -R "${{ github.repository }}"

      - name: Build btop (x86_64-apple-darwin) if latest version missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          TAG=$(gh api repos/aristocratos/btop/releases/latest --jq .tag_name)
          ASSET="btop-${TAG}-x86_64-apple-darwin.tar.gz"
          if gh release view prebuilt-intel -R "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "btop $TAG already built in prebuilt-intel release."
            exit 0
          fi
          echo "Building $ASSET for x86_64-apple-darwin..."
          git clone --depth 1 --branch "$TAG" https://github.com/aristocratos/btop.git /tmp/btop-src
          cd /tmp/btop-src
          cmake -B build -DBTOP_GPU=OFF -DBUILD_TESTING=OFF -DBTOP_LTO=OFF -DBTOP_FORTIFY=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_INSTALL_PREFIX=/tmp/btop-pkg
          cmake --build build -j4
          cmake --install build
          tar -czf "/tmp/${ASSET}" -C /tmp/btop-pkg .
          gh release upload prebuilt-intel "/tmp/${ASSET}" --clobber -R "${{ github.repository }}"

      - name: Build git-delta (x86_64-apple-darwin) if latest version missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          TAG=$(gh api repos/dandavison/delta/releases/latest --jq .tag_name)
          ASSET="delta-${TAG}-x86_64-apple-darwin.tar.gz"
          if gh release view prebuilt-intel -R "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "git-delta $TAG already built in prebuilt-intel release."
            exit 0
          fi
          echo "Building $ASSET for x86_64-apple-darwin..."
          git clone --depth 1 --branch "$TAG" https://github.com/dandavison/delta.git /tmp/delta-src
          cd /tmp/delta-src
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p /tmp/delta-pkg
          cp target/x86_64-apple-darwin/release/delta /tmp/delta-pkg/
          tar -czf "/tmp/${ASSET}" -C /tmp/delta-pkg .
          gh release upload prebuilt-intel "/tmp/${ASSET}" --clobber -R "${{ github.repository }}"

      - name: Build standalone git (x86_64-apple-darwin) if latest version missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          TAG=$(git ls-remote --tags --refs --sort="-v:refname" https://github.com/git/git.git "v2.*" | awk -F/ '!/-(rc|alpha|beta)/ {print $NF; exit}')
          ASSET="git-${TAG}-x86_64-apple-darwin.tar.gz"
          if gh release view prebuilt-intel -R "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "git $TAG already built in prebuilt-intel release."
            exit 0
          fi
          echo "Building $ASSET for x86_64-apple-darwin..."
          git clone --depth 1 --branch "$TAG" https://github.com/git/git.git /tmp/git-src
          cd /tmp/git-src
          make prefix=/usr/local/opt/git \
            CC="clang -arch x86_64 -mmacosx-version-min=11.0" \
            CFLAGS="-O2 -arch x86_64 -mmacosx-version-min=11.0" \
            LDFLAGS="-arch x86_64 -mmacosx-version-min=11.0" \
            NO_GETTEXT=YesPlease \
            NO_TCLTK=YesPlease \
            NO_PCRE2=YesPlease \
            NO_RUST=YesPlease \
            APPLE_COMMON_CRYPTO=1 \
            CURLDIR=/usr \
            EXPATDIR=/usr \
            ZLIB_PATH=/usr \
            ICONVDIR=/usr \
            -j4 all
          make prefix=/usr/local/opt/git \
            CC="clang -arch x86_64 -mmacosx-version-min=11.0" \
            NO_GETTEXT=YesPlease \
            NO_TCLTK=YesPlease \
            NO_PCRE2=YesPlease \
            NO_RUST=YesPlease \
            APPLE_COMMON_CRYPTO=1 \
            CURLDIR=/usr \
            EXPATDIR=/usr \
            ZLIB_PATH=/usr \
            ICONVDIR=/usr \
            DESTDIR=/tmp/git-pkg install
          tar -czf "/tmp/${ASSET}" -C /tmp/git-pkg/usr/local/opt/git .
          gh release upload prebuilt-intel "/tmp/${ASSET}" --clobber -R "${{ github.repository }}"

      - name: Build standalone wget (x86_64-apple-darwin) if latest version missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          VERSION="1.25.0"
          TAG="v${VERSION}"
          ASSET="wget-${TAG}-x86_64-apple-darwin.tar.gz"
          if gh release view prebuilt-intel -R "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "wget $TAG already built in prebuilt-intel release."
            exit 0
          fi
          echo "Building $ASSET for x86_64-apple-darwin..."
          curl -fsSL "https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-4.0.0.tar.gz" | tar -xz -C /tmp
          cmake -S /tmp/libressl-4.0.0 -B /tmp/libressl-build \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBRESSL_APPS=OFF \
            -DLIBRESSL_TESTS=OFF \
            -DOPENSSLDIR=/etc/ssl
          cmake --build /tmp/libressl-build -j4
          curl -fsSL "https://ftpmirror.gnu.org/gnu/wget/wget-${VERSION}.tar.gz" | tar -xz -C /tmp
          cd "/tmp/wget-${VERSION}"
          ./configure --host=x86_64-apple-darwin \
            PKG_CONFIG=/usr/bin/false \
            ac_cv_func_strchrnul=no \
            CC="clang -arch x86_64 -mmacosx-version-min=11.0" \
            CFLAGS="-O2 -I/tmp/libressl-4.0.0/include" \
            OPENSSL_CFLAGS="-I/tmp/libressl-4.0.0/include" \
            OPENSSL_LIBS="/tmp/libressl-build/ssl/libssl.a /tmp/libressl-build/crypto/libcrypto.a" \
            --with-ssl=openssl \
            --sysconfdir=/etc \
            --disable-nls \
            --without-libpsl \
            --without-libidn \
            --disable-pcre2 \
            --disable-pcre \
            --disable-iri \
            --prefix=/tmp/wget-install
          make -j4
          make DESTDIR=/tmp/wget-root install
          mkdir -p /tmp/wget-pkg
          cp /tmp/wget-root/tmp/wget-install/bin/wget /tmp/wget-pkg/
          cp /tmp/wget-root/tmp/wget-install/share/man/man1/wget.1 /tmp/wget-pkg/ || true
          tar -czf "/tmp/${ASSET}" -C /tmp/wget-pkg .
          gh release upload prebuilt-intel "/tmp/${ASSET}" --clobber -R "${{ github.repository }}"

  update:
    needs: build-missing-intel-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Formulas from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_formulas.py

      - name: Commit and Push updated Formulas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if ! git diff --staged --quiet; then
            git commit -m "chore(formula): auto-update Intel prebuilt formulas"
            git push
          else
            echo "No formula updates needed."
          fi

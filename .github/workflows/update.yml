name: Auto Update Intel Formulas

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
    paths:
      - "packages.json"
      - "scripts/update_formulas.py"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Formulas from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_formulas.py

      - name: Commit and Push updated Formulas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if ! git diff --staged --quiet; then
            git commit -m "chore(formula): auto-update Intel prebuilt formulas"
            git push
          else
            echo "No formula updates needed."
          fi
